
name: artstudio

services:
  postgresdb:
    image: postgres:16-alpine
    container_name: postgres-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: klustudentdb
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d klustudentdb"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - artstudio-network

  backend:
    image: jayanavardhannaidu/artstudio-service:latest
    build:
      context: ./ArtStudioService
      dockerfile: Dockerfile
    container_name: artstudio-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgresdb:5432/klustudentdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    ports:
      - "8081:8081"
    depends_on:
      postgresdb:
        condition: service_healthy
    restart: on-failure
    networks:
      - artstudio-network

volumes:
  postgres_data:

networks:
  artstudio-network:
    driver: bridge
